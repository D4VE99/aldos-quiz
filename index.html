<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALDO's</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
:root{
  --bg:#fdf6ec;--surface:#fff;--surface-2:#f5ead6;
  --fg:#3a2e1f;--fg-dim:#9c8b72;
  --accent:#e86c3a;--accent-soft:rgba(232,108,58,.12);
  --coral:#e05252;--coral-soft:rgba(224,82,82,.12);
  --green:#3bb06a;--green-soft:rgba(59,176,106,.12);
  --gold:#d4a017;--gold-soft:rgba(212,160,23,.12);
  --opt-a:#e05252;--opt-b:#4a90d9;--opt-c:#e8a435;--opt-d:#7c6bc4;
  --radius:18px;--radius-sm:12px;
  --shadow:0 2px 12px rgba(58,46,31,.06);
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1f1a14;--surface:#2c2419;--surface-2:#3d3224;
    --fg:#f4ead8;--fg-dim:#a89879;
    --accent:#f0854e;--accent-soft:rgba(240,133,78,.15);
    --coral:#f06b6b;--coral-soft:rgba(240,107,107,.15);
    --green:#56c884;--green-soft:rgba(86,200,132,.15);
    --gold:#eab835;--gold-soft:rgba(234,184,53,.15);
    --opt-a:#f06b6b;--opt-b:#5da0e8;--opt-c:#f0b54a;--opt-d:#9485d6;
    --shadow:0 2px 12px rgba(0,0,0,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1a14;--surface:#2c2419;--surface-2:#3d3224;
  --fg:#f4ead8;--fg-dim:#a89879;
  --accent:#f0854e;--accent-soft:rgba(240,133,78,.15);
  --coral:#f06b6b;--coral-soft:rgba(240,107,107,.15);
  --green:#56c884;--green-soft:rgba(86,200,132,.15);
  --gold:#eab835;--gold-soft:rgba(234,184,53,.15);
  --opt-a:#f06b6b;--opt-b:#5da0e8;--opt-c:#f0b54a;--opt-d:#9485d6;
  --shadow:0 2px 12px rgba(0,0,0,.2);
  color-scheme:dark;
}
html{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Nunito',sans-serif;
  min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:24px 16px;
}
h1,h2,h3{font-family:'Baloo 2',cursive}

.app{width:100%;max-width:720px;display:flex;flex-direction:column;gap:18px}

.logo{font-family:'Baloo 2',cursive;font-weight:800;font-size:2.6rem;text-align:center;color:var(--accent);line-height:1.1}
.logo-sub{font-size:.8rem;color:var(--fg-dim);text-align:center;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:-2px}

.card{background:var(--surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card-header{font-family:'Baloo 2',cursive;font-weight:700;font-size:1.15rem;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;background:var(--accent-soft);color:var(--accent)}

input,textarea{
  width:100%;padding:11px 14px;border-radius:var(--radius-sm);
  border:2px solid var(--surface-2);background:var(--bg);color:var(--fg);
  font-family:inherit;font-size:.95rem;outline:none;transition:border-color .15s;
}
input:focus,textarea:focus{border-color:var(--accent)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 24px;border-radius:var(--radius-sm);border:none;
  font-family:'Baloo 2',cursive;font-weight:700;font-size:.95rem;
  cursor:pointer;transition:transform .1s,opacity .15s;color:#fff;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent)}
.btn-coral{background:var(--coral)}
.btn-green{background:var(--green)}
.btn-ghost{background:transparent;border:2px solid var(--surface-2);color:var(--fg-dim)}
.btn-sm{padding:7px 14px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* Setup: options grid */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.options-grid{grid-template-columns:1fr}}
.option-input-row{display:flex;align-items:center;gap:8px}
.option-input-row input[type="text"]{flex:1;min-width:0}
.option-label{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-family:'Baloo 2',cursive;font-weight:800;font-size:.8rem;color:#fff;flex-shrink:0}
.correct-radio{width:20px;height:20px;accent-color:var(--green);cursor:pointer;flex-shrink:0}

/* Question list */
.q-item{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px;display:flex;align-items:flex-start;gap:12px}
.q-num{font-family:'Baloo 2',cursive;font-weight:800;font-size:.85rem;color:var(--accent);min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);border-radius:8px;flex-shrink:0}
.q-body{flex:1;min-width:0}
.q-text{font-weight:700;margin-bottom:6px;word-break:break-word}
.q-opts{display:flex;flex-wrap:wrap;gap:4px}
.q-opt{font-size:.8rem;padding:2px 8px;border-radius:6px;background:var(--bg);white-space:nowrap}
.q-opt.correct{background:var(--green-soft);color:var(--green);font-weight:700}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:none;background:var(--bg);color:var(--fg-dim);cursor:pointer;font-size:1rem}
.icon-btn:hover{color:var(--coral)}

/* Teams */
.team-list{display:flex;flex-wrap:wrap;gap:8px}
.team-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:var(--surface-2);font-weight:700;font-size:.9rem}
.team-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.team-input-row{display:flex;gap:8px;margin-bottom:8px}
.team-input-row input{flex:1;min-width:0}

/* Game display */
.question-display{text-align:center;padding:28px 20px}
.q-counter{font-family:'Baloo 2',cursive;font-weight:700;font-size:.9rem;color:var(--accent);margin-bottom:6px}
.q-main-text{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.8rem;line-height:1.3;text-wrap:balance}
@media(max-width:500px){.q-main-text{font-size:1.3rem}}

.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media(max-width:500px){.answer-grid{grid-template-columns:1fr}}
.answer-btn{
  padding:18px;border-radius:var(--radius);border:3px solid transparent;
  font-family:'Baloo 2',cursive;font-weight:700;font-size:1.1rem;
  color:#fff;text-align:left;display:flex;align-items:center;gap:10px;
  pointer-events:none;position:relative;
}
.answer-btn .lbl{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.answer-btn:nth-child(1){background:var(--opt-a)}
.answer-btn:nth-child(2){background:var(--opt-b)}
.answer-btn:nth-child(3){background:var(--opt-c)}
.answer-btn:nth-child(4){background:var(--opt-d)}
.answer-btn.correct-reveal{border-color:var(--green);box-shadow:0 0 20px rgba(59,176,106,.3)}
.answer-btn.wrong-reveal{opacity:.35}

/* Scoring: checkboxes per team */
.scoring-section{margin-top:20px}
.scoring-team{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);background:var(--surface-2);cursor:pointer;transition:background .15s;user-select:none}
.scoring-team:hover{background:var(--accent-soft)}
.scoring-team.checked{background:var(--green-soft)}
.scoring-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem;transition:all .15s}
.scoring-team.checked .scoring-check{background:var(--green);border-color:var(--green);color:#fff}
.scoring-name{flex:1;font-weight:700}
.scoring-list{display:flex;flex-direction:column;gap:6px}

/* Leaderboard */
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius-sm);background:var(--surface-2)}
.lb-row:nth-child(1){background:var(--gold-soft)}
.lb-rank{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.15rem;min-width:34px;text-align:center}
.lb-row:nth-child(1) .lb-rank{color:var(--gold)}
.lb-row:nth-child(2) .lb-rank{color:var(--fg-dim)}
.lb-row:nth-child(3) .lb-rank{color:var(--coral)}
.lb-name{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.15rem;color:var(--accent);font-variant-numeric:tabular-nums}
.lb-list{display:flex;flex-direction:column;gap:8px}

.status-msg{text-align:center;padding:24px;color:var(--fg-dim);font-weight:700}
.divider{height:1px;background:var(--surface-2);margin-block:4px}
.fade-in{animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Correct answer banner */
.correct-banner{
  text-align:center;padding:14px;border-radius:var(--radius);
  background:var(--green-soft);color:var(--green);
  font-family:'Baloo 2',cursive;font-weight:800;font-size:1.1rem;
}
</style>
</head>
<body>
<div class="app" id="app">
  <div>
    <div class="logo">ALDO's</div>
    <div class="logo-sub">quiz time</div>
  </div>
  <div id="main"></div>
</div>

<script>
(function(){
  const OPT_LABELS = ['A','B','C','D'];
  const OPT_COLORS = ['var(--opt-a)','var(--opt-b)','var(--opt-c)','var(--opt-d)'];
  const main = document.getElementById('main');

  // ── State ──
  let questions = [];   // [{text, options:[], correct:int}]
  let teamNames = [];   // ['Team 1', 'Team 2', ...]
  let scores = {};       // { 'Team 1': 5, 'Team 2': 3 }
  let phase = 'setup';   // setup | teams | game
  let currentIndex = 0;
  let revealed = false;
  let correctTeams = new Set(); // teams marked correct for current question

  // Persist to localStorage
  function save(){
    try{
      localStorage.setItem('aldos-quiz', JSON.stringify({
        questions, teamNames, scores, phase, currentIndex, revealed
      }));
    }catch(e){}
  }
  function load(){
    try{
      const d = JSON.parse(localStorage.getItem('aldos-quiz'));
      if(d){
        questions = d.questions||[];
        teamNames = d.teamNames||[];
        scores = d.scores||{};
        phase = d.phase||'setup';
        currentIndex = d.currentIndex||0;
        revealed = d.revealed||false;
      }
    }catch(e){}
  }

  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  const rankIcon = i => i===0?'&#127942;':i===1?'&#129352;':i===2?'&#129353;':(i+1);

  // ── Render ──
  function render(){
    save();
    if(phase==='setup') renderSetup();
    else if(phase==='teams') renderTeams();
    else if(phase==='game') renderGame();
  }

  // ── SETUP: create questions ──
  function renderSetup(){
    const qList = questions.length===0
      ? '<div class="status-msg" style="padding:12px">Nessuna domanda ancora. Aggiungine una!</div>'
      : questions.map((q,i)=>`
        <div class="q-item fade-in">
          <div class="q-num">${i+1}</div>
          <div class="q-body">
            <div class="q-text">${esc(q.text)}</div>
            <div class="q-opts">${q.options.map((o,j)=>`<span class="q-opt ${j===q.correct?'correct':''}">${OPT_LABELS[j]} ${esc(o)}</span>`).join('')}</div>
          </div>
          <div style="flex-shrink:0;margin-top:2px"><button class="icon-btn" onclick="removeQ(${i})">&times;</button></div>
        </div>`).join('');

    main.innerHTML=`
      <div class="card">
        <div class="card-header">Crea il tuo Quiz</div>
        <p style="color:var(--fg-dim);font-size:.9rem;margin-bottom:16px">Aggiungi le domande e seleziona la risposta corretta per ognuna.</p>
        <div id="q-list" style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">${qList}</div>
        <div class="divider" style="margin-bottom:16px"></div>
        <input type="text" id="q-text" placeholder="Scrivi la domanda..." style="margin-bottom:10px">
        <div class="options-grid" style="margin-bottom:12px">
          ${[0,1,2,3].map(i=>`
            <div class="option-input-row">
              <div class="option-label" style="background:${OPT_COLORS[i]}">${OPT_LABELS[i]}</div>
              <input type="text" id="q-opt-${i}" placeholder="Opzione ${OPT_LABELS[i]}">
              <input type="radio" name="correct" value="${i}" class="correct-radio" ${i===0?'checked':''}>
            </div>`).join('')}
        </div>
        <button class="btn btn-primary" onclick="addQ()">+ Aggiungi Domanda</button>
      </div>
      <button class="btn btn-green" style="width:100%;font-size:1.1rem;padding:14px" onclick="goToTeams()" ${questions.length===0?'disabled':''}>
        Avanti: Aggiungi Squadre
      </button>`;

    // Enter key on last option → add
    setTimeout(()=>{
      const qt = document.getElementById('q-text');
      if(qt) qt.addEventListener('keydown', e=>{ if(e.key==='Enter') addQ(); });
    },30);
  }

  // ── TEAMS: add team names ──
  function renderTeams(){
    main.innerHTML=`
      <div class="card">
        <div class="card-header">Aggiungi le Squadre <span class="badge">${teamNames.length}</span></div>
        <div class="team-input-row">
          <input type="text" id="team-input" placeholder="Nome squadra..." maxlength="30">
          <button class="btn btn-primary btn-sm" onclick="addTeam()">+</button>
        </div>
        <div class="team-list" id="team-list">
          ${teamNames.length===0?'<div style="color:var(--fg-dim);font-size:.9rem;padding:4px">Nessuna squadra</div>':
            teamNames.map((t,i)=>`
              <div class="team-chip">
                <span class="dot"></span>${esc(t)}
                <button class="icon-btn" style="width:20px;height:20px;font-size:.7rem;background:transparent" onclick="removeTeam(${i})">&times;</button>
              </div>`).join('')}
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="phase='setup';render()">Modifica Domande</button>
        <button class="btn btn-green" style="flex:1" onclick="startGame()" ${teamNames.length<2?'disabled':''}>
          Inizia il Quiz!
        </button>
      </div>`;

    setTimeout(()=>{
      const ti = document.getElementById('team-input');
      if(ti){
        ti.focus();
        ti.addEventListener('keydown', e=>{ if(e.key==='Enter') addTeam(); });
      }
    },30);
  }

  // ── GAME: show questions, mark correct teams, leaderboard ──
  function renderGame(){
    const q = questions[currentIndex];
    if(!q) return;

    const lb = teamNames
      .map(t=>({name:t, score:scores[t]||0}))
      .sort((a,b)=>b.score-a.score);

    main.innerHTML=`
      <div class="card question-display fade-in">
        <div class="q-counter">Domanda ${currentIndex+1} di ${questions.length}</div>
        <div class="q-main-text">${esc(q.text)}</div>
        <div class="answer-grid">
          ${q.options.map((o,j)=>{
            let cls='answer-btn';
            if(revealed && j===q.correct) cls+=' correct-reveal';
            else if(revealed) cls+=' wrong-reveal';
            return `<div class="${cls}">
              <span class="lbl">${OPT_LABELS[j]}</span>
              <span style="flex:1;min-width:0">${esc(o)}</span>
            </div>`;
          }).join('')}
        </div>
      </div>

      ${revealed?`
        <div class="correct-banner fade-in">
          Risposta corretta: ${OPT_LABELS[q.correct]} — ${esc(q.options[q.correct])}
        </div>
        <div class="card fade-in">
          <div class="card-header">Chi ha risposto giusto?</div>
          <p style="color:var(--fg-dim);font-size:.85rem;margin-bottom:12px">Seleziona le squadre che hanno indovinato.</p>
          <div class="scoring-list">
            ${teamNames.map((t,i)=>`
              <div class="scoring-team ${correctTeams.has(t)?'checked':''}" onclick="toggleTeam('${esc(t).replace(/'/g,"\\'")}')">
                <div class="scoring-check">${correctTeams.has(t)?'&#10003;':''}</div>
                <div class="scoring-name">${esc(t)}</div>
                <div style="font-variant-numeric:tabular-nums;color:var(--fg-dim);font-weight:600">${scores[t]||0} pt</div>
              </div>`).join('')}
          </div>
        </div>
        <div class="btn-row">
          ${currentIndex<questions.length-1?`
            <button class="btn btn-primary" style="flex:1" onclick="nextQuestion()">Prossima Domanda</button>
          `:`
            <button class="btn btn-green" style="flex:1" onclick="finishGame()">Termina Quiz</button>
          `}
        </div>
      `:`
        <button class="btn btn-coral" style="width:100%;font-size:1.05rem;padding:14px" onclick="revealAnswer()">Rivela Risposta</button>
      `}

      <div class="card">
        <div class="card-header">Classifica</div>
        <div class="lb-list">
          ${lb.map((e,i)=>`
            <div class="lb-row">
              <div class="lb-rank">${rankIcon(i)}</div>
              <div class="lb-name">${esc(e.name)}</div>
              <div class="lb-score">${e.score}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  // ── FINISHED ──
  function renderFinished(){
    const lb = teamNames
      .map(t=>({name:t, score:scores[t]||0}))
      .sort((a,b)=>b.score-a.score);

    main.innerHTML=`
      <div class="card fade-in" style="text-align:center;padding:36px">
        <div style="font-size:3rem;margin-bottom:8px">&#127942;</div>
        <h2 style="font-size:1.7rem;margin-bottom:6px">Quiz Terminato!</h2>
        ${lb.length>0?`<p style="color:var(--accent);font-size:1.2rem;font-weight:700">${esc(lb[0].name)} vince con ${lb[0].score} punti!</p>`:''}
      </div>
      <div class="card">
        <div class="card-header">Classifica Finale</div>
        <div class="lb-list">
          ${lb.map((e,i)=>`
            <div class="lb-row fade-in" style="animation-delay:${i*0.06}s">
              <div class="lb-rank">${rankIcon(i)}</div>
              <div class="lb-name">${esc(e.name)}</div>
              <div class="lb-score">${e.score}</div>
            </div>`).join('')}
        </div>
      </div>
      <button class="btn btn-ghost" style="width:100%" onclick="resetAll()">Nuovo Quiz</button>`;
  }

  // ── Actions ──
  window.addQ = function(){
    const text = document.getElementById('q-text')?.value?.trim();
    const opts = [0,1,2,3].map(i=>document.getElementById('q-opt-'+i)?.value?.trim());
    const ce = document.querySelector('input[name="correct"]:checked');
    const correct = ce ? parseInt(ce.value) : 0;
    if(!text){document.getElementById('q-text')?.focus();return;}
    if(opts.some(o=>!o)) return;
    questions.push({text,options:opts,correct});
    render();
    setTimeout(()=>{
      document.getElementById('q-text').value='';
      [0,1,2,3].forEach(i=>document.getElementById('q-opt-'+i).value='');
      document.querySelector('input[name="correct"][value="0"]').checked=true;
      document.getElementById('q-text').focus();
    },20);
  };

  window.removeQ = function(i){ questions.splice(i,1); render(); };

  window.goToTeams = function(){
    if(questions.length===0) return;
    phase='teams';
    render();
  };

  window.addTeam = function(){
    const inp = document.getElementById('team-input');
    const name = inp?.value?.trim();
    if(!name) return;
    if(teamNames.includes(name)){inp.value='';inp.focus();return;}
    teamNames.push(name);
    scores[name] = scores[name]||0;
    render();
  };

  window.removeTeam = function(i){
    const name = teamNames[i];
    teamNames.splice(i,1);
    delete scores[name];
    render();
  };

  window.startGame = function(){
    if(teamNames.length<2) return;
    phase='game';
    currentIndex=0;
    revealed=false;
    correctTeams.clear();
    // Reset scores
    scores={};
    teamNames.forEach(t=>scores[t]=0);
    render();
  };

  window.revealAnswer = function(){
    revealed=true;
    correctTeams.clear();
    render();
  };

  window.toggleTeam = function(name){
    if(correctTeams.has(name)){
      correctTeams.delete(name);
      scores[name] = (scores[name]||0) - 1;
    } else {
      correctTeams.add(name);
      scores[name] = (scores[name]||0) + 1;
    }
    render();
  };

  window.nextQuestion = function(){
    currentIndex++;
    revealed=false;
    correctTeams.clear();
    render();
  };

  window.finishGame = function(){
    phase='finished';
    render();
    renderFinished();
    save();
  };

  window.resetAll = function(){
    questions=[];
    teamNames=[];
    scores={};
    phase='setup';
    currentIndex=0;
    revealed=false;
    correctTeams.clear();
    try{localStorage.removeItem('aldos-quiz');}catch(e){}
    render();
  };

  // ── Init ──
  load();
  render();
})();
</script>
</body>
</html>
